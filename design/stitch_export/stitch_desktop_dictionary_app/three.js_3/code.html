## 3. Windows 11 划词悬浮浮层组件 (`src/components/win11/FloatingQuickHUD.tsx`)

```tsx
import React, { useEffect, useState } from 'react';
import { Volume2, Star, Copy, ExternalLink, Sparkles, Check } from 'lucide-react';

interface FloatingHUDProps {
  word: string;
  phonetic: string;
  translation: string;
  pos: string;
  onExpand: () => void;
  onDismiss: () => void;
}

export const WindowsFloatingHUD: React.FC<FloatingHUDProps> = ({
  word,
  phonetic,
  translation,
  pos,
  onExpand,
  onDismiss,
}) => {
  const [copied, setCopied] = useState(false);
  const [starred, setStarred] = useState(false);

  useEffect(() => {
    const handleKeyDown = (e: KeyboardEvent) => {
      if (e.key === 'Escape') onDismiss();
      if (e.key === 'Enter') onExpand();
      if (e.key === 'c' && (e.ctrlKey || e.metaKey)) {
        navigator.clipboard.writeText(`${word} [${phonetic}] ${translation}`);
        setCopied(true);
        setTimeout(() => setCopied(false), 1200);
      }
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [word, phonetic, translation, onDismiss, onExpand]);

  return (
    <div 
      className="w-[380px] bg-[#202020]/90 backdrop-blur-xl border border-white/10 rounded-[8px] p-4 shadow-2xl text-white select-none transition-all duration-200"
      style={{
        boxShadow: '0 12px 36px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.08)'
      }}
    >
      {/* 顶部标题与音标 */}
      <div className="flex items-center justify-between mb-2">
        <div className="flex items-center gap-2">
          <span className="font-semibold text-lg tracking-wide text-white">{word}</span>
          <span className="text-xs font-mono text-white/50">{phonetic}</span>
          <button 
            tabIndex={1}
            title="播放离线发音 (Alt+P)"
            className="p-1 hover:bg-white/10 rounded text-white/70 hover:text-white transition-colors"
          >
            <Volume2 size={14} />
          </button>
        </div>
        <div className="flex items-center gap-1.5 text-[11px] text-[#60cdff] bg-[#60cdff]/10 px-2 py-0.5 rounded border border-[#60cdff]/20">
          <Sparkles size={12} />
          <span>Hy-MT2 0ms</span>
        </div>
      </div>

      {/* 词义释义 */}
      <div className="bg-[#1b1c1c]/80 rounded p-2.5 border border-white/5 mb-3">
        <div className="flex items-baseline gap-2">
          <span className="text-[11px] font-bold text-[#60cdff]">{pos}</span>
          <span className="text-sm text-white/90 leading-relaxed">{translation}</span>
        </div>
      </div>

      {/* 底部操作工具栏 */}
      <div className="flex items-center justify-between pt-1 border-t border-white/5 text-xs text-white/60">
        <div className="flex items-center gap-2">
          <button 
            tabIndex={2}
            onClick={() => setStarred(!starred)}
            className={`flex items-center gap-1 px-2 py-1 rounded transition-colors ${starred ? 'text-amber-400 bg-amber-400/10' : 'hover:bg-white/10'}`}
          >
            <Star size={12} className={starred ? 'fill-amber-400' : ''} />
            <span>{starred ? '已存' : '生词'}</span>
          </button>
          <button 
            tabIndex={3}
            onClick={() => {
              navigator.clipboard.writeText(translation);
              setCopied(true);
              setTimeout(() => setCopied(false), 1200);
            }}
            className="flex items-center gap-1 px-2 py-1 hover:bg-white/10 rounded transition-colors"
          >
            {copied ? <Check size={12} className="text-emerald-400" /> : <Copy size={12} />}
            <span>{copied ? '已拷' : '复制'}</span>
          </button>
        </div>

        <button 
          tabIndex={4}
          onClick={onExpand}
          className="flex items-center gap-1 px-2.5 py-1 bg-[#60cdff]/15 hover:bg-[#60cdff]/25 text-[#60cdff] rounded border border-[#60cdff]/30 transition-all font-medium"
        >
          <span>展开主窗</span>
          <ExternalLink size={12} />
        </button>
      </div>
    </div>
  );
};
```

## 5. Rust 底层 Tauri 2 窗口配置 (`src-tauri/src/main.rs`)

```rust
use tauri::{AppHandle, Manager, WebviewWindowBuilder, WebviewUrl};

#[tauri::command]
fn show_floating_hud(app: AppHandle, x: f64, y: f64) {
    if let Some(window) = app.get_webview_window("quick-hud") {
        let _ = window.set_position(tauri::Position::Logical(tauri::LogicalPosition { x, y }));
        let _ = window.show();
        let _ = window.set_focus();
    }
}

fn main() {
    tauri::Builder::default()
        .setup(|app| {
            // 创建非抢占式悬浮窗口 (Windows WS_EX_NOACTIVATE 风格)
            let _window = WebviewWindowBuilder::new(
                app,
                "quick-hud",
                WebviewUrl::App("hud.html".into())
            )
            .title("Quick Lookup")
            .inner_size(380.0, 190.0)
            .resizable(false)
            .always_on_top(true)
            .decorations(false)
            .transparent(true)
            .skip_taskbar(true)
            .build()?;

            Ok(())
        })
        .run(tauri::generate_context!())
        .expect("error while running tauri application");
}
