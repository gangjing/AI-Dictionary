## 1. 设计哲学与跨平台一致性原则

AI Dictionary 的核心动效体系旨在解决传统词典软件“弹窗抢占系统焦点阻断工作流”、“动效僵硬跳跃”与“跨平台质感割裂”的三大痛点。

| 平台 | 质感与视觉基调 | 核心材质 | 运动特征 |
| :--- | :--- | :--- | :--- |
| **Windows 11 Fluent** | **Mica Alt + 亚克力深度层级** | Mica Alt 底层 + 20px~48px 亚克力光晕 | 强起动爆发力、快速爬升、平缓无抖动的次临界收敛 (Sub-critical Settle) |
| **macOS Sonoma/Sequoia** | **Liquid Glass 通透流体毛玻璃** | 16px~48px 高斯模糊 + 1px 细微镜面光泽边框 | 柔和微回弹、弹性十足的自然重力阻尼、流体感拉伸 (Fluid Spring) |

## 2. 双平台物理弹簧与插值参数总表

### 2.1 物理弹簧模型 (Spring Physics Parameters)

用于窗口几何缩放、大小形变 (Hero Bounding Warp) 与卡片展开。

| 物理参数项 | Windows 11 Fluent 规范 | macOS Sonoma / Sequoia 规范 | 研发定义与换算依据 |
| :--- | :--- | :--- | :--- |
| **物理引擎 / 动画系统** | **WinUI 3 Dynamic Spring / Composition API** | **CoreAnimation `CASpringAnimation`** | 统一基于经典质量-弹簧-阻尼二阶微积分方程 |
| **Stiffness ($k$, 劲度系数)** | `420 N/m` | `380 N/m` | 决定初速度和响应张力；Win11 响应更干脆，macOS 更柔韧 |
| **Damping Ratio ($\zeta$, 阻尼比)** | `0.82` (次临界阻尼, Sub-critically Damped) | `0.78` (轻度次临界, Gentle Overshoot) | $\zeta < 1.0$ 允许微小自然过冲；macOS 允许约 1.5% 视觉回弹 |
| **Damping Coefficient ($c$)** | `34.0 Ns/m` | `32.0 Ns/m` | 能量衰减速率 |
| **Mass ($m$, 虚拟质量)** | `1.0 kg` | `1.0 kg` | 动效惯性权重 |
| **标准化运行时长 (Duration)** | `500 ms` | `600 ms` | 从触发 (T0) 到物理完全静止 (Velocity < 0.001) 的总耗时 |
| **有效视觉就位点 (95% Target)** | **`240 ms`** | **`260 ms`** | 用户主观感知“窗口已到位”的时刻，此时子元素已可交互 |

### 2.2 贝塞尔曲线回退参数 (Cubic-Bezier Curves for Web/CSS Fallback)

当因系统资源或 CSS 降级无法使用原生物理弹簧时，采用以下预烘焙等效三阶贝塞尔曲线：

```css
/* Windows 11 Fluent Standard Motion Curve */
--ease-fluent-spring: cubic-bezier(0.16, 1.0, 0.3, 1.0);

/* macOS Liquid Glass Natural Fluid Curve */
--ease-macos-fluid: cubic-bezier(0.2, 0.9, 0.2, 1.0);

/* 通用退出 / 销毁极速淡出曲线 */
--ease-dismiss-fast: cubic-bezier(0.0, 0.0, 0.2, 1.0);
```

## 3. 场景一：划词悬浮卡展开至主窗口

**用户旅程：** 在 VS Code / 浏览器选中单词 `latency` 或 `ephemeral` → 触发轻量悬浮卡 → 按下 `Enter` 或点击「展开」→ 平滑流转扩充为 1080p 词典大工作台。

### 3.1 时序阶段编排 (Choreography Phases)

```
0ms               100ms             240ms             380ms             500ms
├─────────────────┼─────────────────┼─────────────────┼─────────────────┤
│ Phase 01: Lock  │ Phase 02: Warp  │ Phase 03: Mat   │ Phase 04: Reveal│
│ 选区与锚点锁定   │ 几何外壳弹性拉伸 │ 材质解耦与阴影  │ 多义项交错级联淡入│
```

#### Phase 01: 边界冻结与合成层准备 (0ms – 100ms)
- **动作：** 捕获当前选区绝对屏幕坐标 `(X, Y)`，创建或提权重合的合成 Surface。
- **Win11：** DirectComposition 申请合成树节点，锁定起始尺寸 `380 × 190 px`。
- **macOS：** AppKit 激活 Metal 3 驱动的独立 Layer，锁定起始尺寸 `360 × 180 px`。
- **状态变化：** 浮层原内容略微收缩（Scale: `1.00 → 0.98`，耗时 60ms），提供动能积蓄感。

#### Phase 02: Hero 几何拉伸 (100ms – 240ms)
- **动作：** 窗口从紧凑胶囊放大至主窗口完整尺寸。
- **目标边界 (Target Bounding)：**
  * Windows 11：`380 × 190 px` $\rightarrow$ `1120 × 720 px`
  * macOS：`360 × 180 px` $\rightarrow$ `1080 × 720 px`
- **坐标位移 (Anchor Morph)：** 保持左上角视觉中心锁定，向右下方呈弧线扩展。

#### Phase 03: 材质与景深扩散 (240ms – 380ms)
- **背景材质过渡：**
  * Win11：`20px Acrylic` $\rightarrow$ `Mica Alt + Subsurface` 桌面材质。
  * macOS：`16px blur` $\rightarrow$ `48px Liquid Glass` 高斯模糊层。
- **DWM / 系统阴影扩散：**
  * Win11：`elevation-4 (12px blur)` $\rightarrow$ `elevation-32 (48px bloom, opacity 0.35)`。
  * macOS：`0 10px 30px rgba(0,0,0,0.3)` $\rightarrow$ `0 32px 80px rgba(0,0,0,0.55)`。

#### Phase 04: 义项交错瀑布淡入 (380ms – 500ms)
- **级联次序 (Stagger Order)：**
  1. 标题词、音标音标与发音扬声器 ($T = 360\text{ms}$)
  2. 腾讯 Hy-MT2 本地端侧 AI 推理徽标与消歧卡片 ($T = 395\text{ms}$, 延后 35ms)
  3. 权威第一义项与例句 ($T = 430\text{ms}$, 延后 35ms)
  4. 专业领域展开组（计算机、医学）与底部工具条 ($T = 465\text{ms}$, 延后 35ms)
- **单项淡入动效：** `Opacity: 0 → 1`，伴随垂直位移 `Y: +12px → 0px`，曲线采用 `cubic-bezier(0.16, 1, 0.3, 1)`。

## 4. 场景二：系统托盘 / 菜单栏小窗展开至多维详情态

**用户旅程：** 点击 Windows 任务栏右下角托盘图标（或 macOS 顶部状态栏图标）弹出极简小窗 → 搜索 `latency` → 点击展开/按 `Alt+Up` / `⌘E` → 向左上或正下方展开为宽体高维词条视窗。

### 4.1 几何流转与物理参数

| 属性 | Windows 11 托盘小窗展开 (Tray Flyout) | macOS 菜单栏小窗展开 (Menu Bar Popover) |
| :--- | :--- | :--- |
| **展开方向 (Growth Vector)** | **自屏幕右下角向左上方延展** ($-\Delta X, -\Delta Y$) | **紧扣状态栏指示标，自上而下垂落延展** ($+\Delta Y$) |
| **收起态尺寸 (Collapsed)** | `380 × 460 px` | `380 × 480 px` |
| **展开态尺寸 (Expanded)** | `760 × 660 px` | `740 × 680 px` |
| **边角倒角变化 (Corner Radius)**| 固定 `8px` (Fluent 标准圆角) | 顶部 Popover 尖角保持，主视窗 `14px` 圆角 |
| **内部布局分流** | 单列极简列表 $\rightarrow$ 双列复合网格 (Pivot 选项卡) | 单列小卡片 $\rightarrow$ Spotlight 分段多领域展开卡 |
| **动效持续时长** | `360 ms` | `380 ms` |
| **回弹控制** | 无超调 (Critically Damped, $\zeta = 0.90$) | 柔和回弹 ($\zeta = 0.84$) |

## 5. 场景三：轻量取词浮层入场与退场

**触发条件：** 全局热键 `Ctrl+Alt+T` (Win) / `⌥⌘T` (macOS)；外部应用文本选中。

### 5.1 入场动效 (Entry HUD Motion)
- **初始状态：** `Opacity: 0`，`Scale: 0.94`，`Transform Y: +8px`（从光标避让点微上浮）。
- **终态：** `Opacity: 1`，`Scale: 1.0`，`Transform Y: 0`。
- **时长：** **`120 ms`**（极速响应，不得超过 150ms 研发指标红线）。
- **插值曲线：** `cubic-bezier(0.0, 0.0, 0.2, 1.0)`（Decelerate 减速曲线，快速冲出）。

### 5.2 静音退出 (Light Dismiss / Esc Exit)
- **触发：** 按下 `Esc` 或鼠标点击浮层外部非活动区域。
- **动效：** `Opacity: 1 → 0`，伴随 `Transform Y: 0 → -4px`。
- **时长：** **`80 ms`**（瞬时消失，避免视觉残留干扰用户视线）。
- **焦点归还：** 0ms 瞬时无损释放输入法焦点与按键监听。

## 6. 系统无障碍与无打扰焦点架构规范

### 6.1 非抢占式焦点交接模型 (Non-Stealing Focus Architecture)

```
[用户在 VS Code 中编写代码 / 光标闪烁]
       │
       ▼ (全局热键选词)
[创建浮层窗口: Win32 WS_EX_NOACTIVATE / AppKit NSWindow.CollectionBehavior.transient]
       │
       ├─► 外部编辑器光标持续闪烁，用户打字完全不受阻断
       │
       ▼ (用户轻敲 Tab 键)
[平滑接力焦点至浮层首项 / 边框亮起无障碍外发光]
       │
       ▼ (按 Esc)
[浮层 80ms 淡出，焦点精准归还 VS Code 编辑区]
```

### 6.2 减弱动效回退标准 (`prefers-reduced-motion`)

为保障眩晕症及光敏性弱势群体的可用性，当检测到 OS 级关闭动效时（Windows「显示动画」关 / macOS「减弱动态效果」开）：
1. **彻底禁用所有窗口几何拉伸 (No Scale / No Morph)**。
2. 展开视窗直接以最终几何尺寸在目标位置就位。
3. **退化为原位跨深入淡 (Cross-fade in place)**：
   * 持续时间统一锁死为 **`80 ms`**。
   * `Opacity: 0 → 1`。
   * 严格符合 **WCAG 2.2 AAA (Guideline 2.3.3 Animation from Interactions)** 标准。

## 7. 研发工程实现指南

### 7.1 Web / React / Tailwind 代码片段

```tsx
// 动效参数常量定义
export const MOTION_TOKENS = {
  win11: {
    springExpansion: 'cubic-bezier(0.16, 1.0, 0.3, 1.0)',
    durationMs: 500,
    staggerMs: 35,
  },
  macOS: {
    springExpansion: 'cubic-bezier(0.2, 0.9, 0.2, 1.0)',
    durationMs: 600,
    staggerMs: 45,
  },
  dismiss: {
    durationMs: 80,
    curve: 'cubic-bezier(0.4, 0.0, 1.0, 1.0)',
  }
};

// 义项级联淡入样式助手
export function getStaggerStyle(index: number, isMacOS: boolean) {
  const baseDelay = isMacOS ? 360 : 340;
  const step = isMacOS ? 45 : 35;
  return {
    animationDuration: '280ms',
    animationTimingFunction: isMacOS 
      ? MOTION_TOKENS.macOS.springExpansion 
      : MOTION_TOKENS.win11.springExpansion,
    animationDelay: `${baseDelay + index * step}ms`,
    animationFillMode: 'both' as const,
  };
}
```

### 7.2 macOS AppKit / CoreAnimation 示例

```swift
// macOS 原生 Popover 展开动画配置
let spring = CASpringAnimation(keyPath: "bounds")
spring.mass = 1.0
spring.stiffness = 380.0
spring.damping = 32.0
spring.initialVelocity = 0.0
spring.duration = spring.settlingDuration // 约为 0.58s
spring.fromValue = NSValue(rect: NSRect(x: startX, y: startY, width: 360, height: 180))
spring.toValue = NSValue(rect: NSRect(x: targetX, y: targetY, width: 1080, height: 720))
window.contentView?.layer?.add(spring, forKey: "heroWarp")
```

### 7.3 Windows 11 WinUI 3 / C++ 示例

```cpp
// WinUI 3 Dynamic Spring Animation for Morph
auto compositor = Microsoft::UI::Xaml::Media::CompositionTarget::GetCompositorForCurrentThread();
auto springScalar = compositor.CreateSpringVector2NaturalMotionAnimation();
springScalar.Period(Windows::Foundation::TimeSpan{ std::chrono::milliseconds(240) });
springScalar.DampingRatio(0.82f);
springScalar.FinalValue(Windows::Foundation::Numerics::float2(1120.0f, 720.0f));
windowVisual.StartAnimation(L"Size", springScalar);
```
