## 3. macOS 原生划词悬浮胶囊组件 (`src/components/macos/MacOSQuickPill.tsx`)

```tsx
import React, { useEffect, useState } from 'react';
import { Volume2, Bookmark, Copy, ArrowUpRight, Cpu } from 'lucide-react';

interface MacOSQuickPillProps {
  word: string;
  phonetic: string;
  pos: string;
  definition: string;
  onExpand: () => void;
  onDismiss: () => void;
}

export const MacOSQuickPill: React.FC<MacOSQuickPillProps> = ({
  word,
  phonetic,
  pos,
  definition,
  onExpand,
  onDismiss,
}) => {
  const [copied, setCopied] = useState(false);
  const [saved, setSaved] = useState(false);

  useEffect(() => {
    const handleKey = (e: KeyboardEvent) => {
      if (e.key === 'Escape') onDismiss();
      if (e.key === 'Enter') onExpand();
    };
    window.addEventListener('keydown', handleKey);
    return () => window.removeEventListener('keydown', handleKey);
  }, [onDismiss, onExpand]);

  return (
    <div 
      className="w-[360px] bg-[#1e1e20]/80 dark:bg-[#1a1a1c]/85 backdrop-blur-2xl border border-white/15 rounded-[12px] p-3.5 text-white select-none shadow-liquid-glass-dark"
    >
      {/* 顶部红黄绿微控与芯片指标 */}
      <div className="flex items-center justify-between mb-2">
        <div className="flex items-center gap-1.5">
          <div className="w-2.5 h-2.5 rounded-full bg-[#ff5f56]" />
          <div className="w-2.5 h-2.5 rounded-full bg-[#ffbd2e]" />
          <div className="w-2.5 h-2.5 rounded-full bg-[#27c93f]" />
          <span className="text-[11px] font-medium text-white/50 ml-1.5 tracking-tight">AI DICT HUD</span>
        </div>
        <div className="flex items-center gap-1 text-[10px] font-medium text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">
          <Cpu size={11} />
          <span>Metal 3 · 0ms</span>
        </div>
      </div>

      {/* 词头与音标 */}
      <div className="flex items-baseline justify-between mb-2">
        <div className="flex items-baseline gap-2">
          <h3 className="text-base font-semibold tracking-tight text-white">{word}</h3>
          <span className="text-xs text-white/50 font-mono">{phonetic}</span>
        </div>
        <button 
          title="播放发音 (⌘P)"
          className="p-1 hover:bg-white/10 rounded-full text-white/70 hover:text-white transition-colors"
        >
          <Volume2 size={13} />
        </button>
      </div>

      {/* 结构化释义卡片 */}
      <div className="bg-white/5 border border-white/5 rounded-[8px] p-2.5 mb-3">
        <div className="flex items-baseline gap-2">
          <span className="text-[10px] font-bold text-sky-400 uppercase tracking-wider">{pos}</span>
          <span className="text-xs text-white/90 leading-relaxed">{definition}</span>
        </div>
      </div>

      {/* 底部按钮栏 */}
      <div className="flex items-center justify-between pt-1 border-t border-white/5 text-xs text-white/60">
        <div className="flex items-center gap-1">
          <button 
            onClick={() => setSaved(!saved)}
            className={`flex items-center gap-1 px-2 py-1 rounded-[6px] transition-colors ${saved ? 'text-amber-400 bg-amber-400/15' : 'hover:bg-white/10'}`}
          >
            <Bookmark size={11} className={saved ? 'fill-amber-400' : ''} />
            <span>{saved ? '已存' : '生词'}</span>
          </button>
          <button 
            onClick={() => {
              navigator.clipboard.writeText(`${word}: ${definition}`);
              setCopied(true);
              setTimeout(() => setCopied(false), 1200);
            }}
            className="flex items-center gap-1 px-2 py-1 hover:bg-white/10 rounded-[6px] transition-colors"
          >
            <Copy size={11} />
            <span>{copied ? '已拷' : '复制'}</span>
          </button>
        </div>

        <button 
          onClick={onExpand}
          className="flex items-center gap-1 px-2.5 py-1 bg-white/10 hover:bg-white/20 text-white rounded-[6px] transition-all font-medium text-xs border border-white/10"
        >
          <span>完整分析</span>
          <ArrowUpRight size={12} />
        </button>
      </div>
    </div>
  );
};
```

## 5. macOS 原生 CoreAnimation / Swift 动效实现参考 (`src-tauri/native/motion.swift`)

```swift
import AppKit
import QuartzCore

@objc public class WindowAnimator: NSObject {
    @objc public static func expandPopover(
        window: NSWindow,
        fromRect: NSRect,
        toRect: NSRect,
        completion: @escaping () -> Void
    ) {
        let spring = CASpringAnimation(keyPath: "frame")
        spring.mass = 1.0
        spring.stiffness = 380.0
        spring.damping = 32.0
        spring.fromValue = NSValue(rect: fromRect)
        spring.toValue = NSValue(rect: toRect)
        spring.duration = spring.settlingDuration
        
        CATransaction.begin()
        CATransaction.setCompletionBlock {
            window.setFrame(toRect, display: true)
            completion()
        }
        window.contentView?.layer?.add(spring, forKey: "heroMorph")
        CATransaction.commit()
    }
}
