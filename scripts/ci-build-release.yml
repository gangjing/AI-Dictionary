name: Release Cross-Platform Installers (Windows & macOS)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native-and-tauri-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            label: 'macOS-Apple-Silicon-arm64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            label: 'macOS-Intel-x64'
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            label: 'Windows-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11 (Dictionary ETL & Packaging)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build SQLite FTS5 Dictionary Database (14,625 Public Entries)
        run: python scripts/etl_dictionary.py

      - name: Run Automated Acceptance & Performance Suite
        run: python scripts/verify_acceptance.py

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,x86_64-pc-windows-msvc

      - name: Build Tauri v2 Release Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'AI Dictionary v__VERSION__'
          releaseBody: 'Cross-platform offline AI Dictionary (Windows x64 MSI/NSIS & macOS arm64/x64 DMG/PKG).'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
