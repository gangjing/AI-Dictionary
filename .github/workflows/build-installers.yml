name: Build and test native installers
on:
  push:
    branches: ['fix/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
          - os: macos-14
            platform: macos
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.17.0 playwright==1.58.0
      - run: python -m playwright install chromium webkit
      - name: Regression tests (isolated data)
        run: python scripts/test_regressions.py
      - name: Native package with bundled Python runtime
        run: python scripts/build_installers.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Dictionary-1.0.1-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/installers/*1.0.1*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/test-results/
